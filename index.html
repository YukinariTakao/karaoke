<!DOCTYPE html>
<html lang="ja" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Myカラオケ帳">
  <meta name="theme-color" content="#090d16">
  <title>Myカラオケ帳 - 持ち曲・音域・スコア管理</title>
  
  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Lucide Icons -->
  <script src="https://unpkg.com/lucide@latest"></script>
  <!-- Chart.js (スコア推移グラフ用) -->
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <!-- Google Fonts -->
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=Noto+Sans+JP:wght@400;500;700;800&display=swap" rel="stylesheet">

  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: {
            sans: ['"Inter"', '"Noto Sans JP"', 'sans-serif'],
            mono: ['"Inter"', 'monospace']
          },
          colors: {
            bgBase: '#090d16',
            bgCard: '#131b2e',
            bgCardHover: '#1c2742',
            accentPrimary: '#6366f1',
            joyColor: '#3b82f6',
            damColor: '#f43f5e'
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #090d16;
      color: #f1f5f9;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }
    input, select, textarea {
      user-select: auto;
    }
    .custom-scroll::-webkit-scrollbar {
      display: none;
    }
    .custom-scroll {
      -ms-overflow-style: none;
      scrollbar-width: none;
    }
  </style>
</head>
<body class="min-h-screen flex flex-col pb-24">

  <!-- JSON参照モード時の警告バナー -->
  <div id="json-mode-banner" class="hidden bg-amber-500/20 border-b border-amber-500/40 px-4 py-2 sticky top-0 z-40 backdrop-blur-md">
    <div class="max-w-2xl mx-auto flex items-center justify-between gap-2">
      <div class="flex items-center gap-1.5 text-xs text-amber-300 font-medium">
        <i data-lucide="alert-triangle" class="w-4 h-4 text-amber-400 shrink-0"></i>
        <span>JSON一時参照中（ローカルデータ保護中）</span>
      </div>
      <button id="btn-exit-json-mode" class="px-2.5 py-1 bg-amber-500 hover:bg-amber-400 text-slate-950 font-bold rounded-lg text-xs transition shrink-0 active:scale-95">
        ローカルに戻る
      </button>
    </div>
  </div>

  <!-- ヘッダー -->
  <header class="sticky top-0 z-30 bg-bgBase/90 backdrop-blur-md border-b border-slate-800/80 px-4 py-3">
    <div class="max-w-2xl mx-auto flex items-center justify-between">
      <div class="flex items-center space-x-2">
        <div class="w-8 h-8 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-lg shadow-indigo-500/30">
          <i data-lucide="mic-2" class="w-5 h-5"></i>
        </div>
        <div>
          <h1 class="text-base font-bold leading-tight flex items-center gap-2">
            Myカラオケ帳
            <span id="total-songs-badge" class="text-[11px] font-normal px-2 py-0.5 rounded-full bg-slate-800 text-indigo-400 border border-indigo-500/20">0曲</span>
          </h1>
          <p class="text-[10px] text-slate-400">音域・スコア推移データベース</p>
        </div>
      </div>
      <div class="flex items-center space-x-2">
        <button id="btn-export-json" class="p-2 text-xs bg-slate-800/80 border border-slate-700 hover:bg-slate-700 text-slate-300 rounded-lg flex items-center gap-1 transition">
          <i data-lucide="file-json" class="w-3.5 h-3.5"></i>
          <span>JSON</span>
        </button>
        <button id="btn-open-add-modal" class="px-3 py-1.5 text-xs font-semibold bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg shadow-md shadow-indigo-600/30 flex items-center gap-1 transition active:scale-95">
          <i data-lucide="plus" class="w-4 h-4"></i>
          <span>曲追加</span>
        </button>
      </div>
    </div>

    <!-- 検索 & フィルターバー -->
    <div class="max-w-2xl mx-auto mt-2.5 space-y-2">
      <div class="relative flex items-center">
        <i data-lucide="search" class="w-4 h-4 text-slate-400 absolute left-3 pointer-events-none"></i>
        <input type="search" id="search-input" placeholder="曲名・アーティスト・よみがな検索..." 
          class="w-full pl-9 pr-8 py-2 bg-slate-900 border border-slate-700/80 rounded-xl text-xs text-slate-100 placeholder-slate-500 focus:outline-none focus:border-indigo-500 focus:ring-1 focus:ring-indigo-500 transition">
        <button id="clear-search-btn" class="absolute right-2.5 p-1 text-slate-400 hover:text-slate-200 hidden">
          <i data-lucide="x" class="w-3.5 h-3.5"></i>
        </button>
      </div>

      <!-- 50音クイックインデックス -->
      <div id="syllabary-bar" class="flex items-center space-x-1 overflow-x-auto custom-scroll py-1 text-[11px] font-medium text-slate-400 border-t border-slate-800/40">
        <button class="syl-btn px-2.5 py-1 rounded-md bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 whitespace-nowrap font-bold" data-syl="ALL">すべて</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="あ">あ</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="か">か</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="さ">さ</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="た">た</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="な">な</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="は">は</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="ま">ま</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="や">や</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="ら">ら</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="わ">わ</button>
        <button class="syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap" data-syl="他">他</button>
      </div>
    </div>
  </header>

  <!-- メインコンテンツ -->
  <main class="max-w-2xl mx-auto w-full px-4 pt-3 flex-1">
    <div id="songs-container" class="space-y-3">
      <!-- JavaScriptで動的生成 -->
    </div>
    <div id="empty-state" class="hidden py-16 text-center text-slate-500 text-xs">
      <i data-lucide="music-4" class="w-10 h-10 mx-auto mb-2 text-slate-600"></i>
      一致する曲が見つかりませんでした
    </div>
  </main>

  <!-- ボトムタブバー -->
  <nav class="fixed bottom-0 left-0 right-0 z-30 bg-bgBase/95 backdrop-blur-md border-t border-slate-800/90 py-1.5 px-6">
    <div class="max-w-md mx-auto grid grid-cols-3 gap-2">
      <button id="tab-btn-kana" class="flex flex-col items-center justify-center py-1 text-indigo-400 font-semibold transition active:scale-95" data-tab="kana">
        <i data-lucide="list-ordered" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[10px]">50音順</span>
      </button>
      <button id="tab-btn-artist" class="flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-200 transition active:scale-95" data-tab="artist">
        <i data-lucide="users" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[10px]">アーティスト別</span>
      </button>
      <button id="tab-btn-rank" class="flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-200 transition active:scale-95" data-tab="rank">
        <i data-lucide="trophy" class="w-5 h-5 mb-0.5"></i>
        <span class="text-[10px]">ランキング</span>
      </button>
    </div>
  </nav>

  <!-- 1. 曲詳細＆スコア履歴モーダル -->
  <div id="detail-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-700/80 w-full sm:max-w-lg rounded-t-2xl sm:rounded-2xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
      <!-- 詳細ヘッダー -->
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80 sticky top-0 z-10">
        <div class="min-w-0 pr-2">
          <h2 id="detail-title" class="text-base font-bold text-slate-100 truncate"></h2>
          <p id="detail-artist" class="text-xs text-slate-400 truncate"></p>
        </div>
        <div class="flex items-center space-x-1 shrink-0">
          <button id="btn-open-edit" class="p-2 text-xs text-indigo-400 hover:text-indigo-300 hover:bg-slate-800 rounded-lg flex items-center gap-1 transition">
            <i data-lucide="pencil" class="w-4 h-4"></i>
            <span>編集</span>
          </button>
          <button id="btn-close-detail" class="p-2 text-slate-400 hover:text-white rounded-lg">
            <i data-lucide="x" class="w-5 h-5"></i>
          </button>
        </div>
      </div>

      <!-- 詳細スクロールコンテンツ -->
      <div class="overflow-y-auto p-4 space-y-4 custom-scroll">
        <!-- 音域サマリー -->
        <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[11px] font-semibold text-slate-400 mb-2 flex items-center justify-between">
            <span>音域データ</span>
            <span class="text-[10px] text-slate-500">中央ド = C4 (mid2C)</span>
          </div>
          <div class="grid grid-cols-3 gap-2 text-center">
            <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800">
              <span class="text-[10px] text-slate-400 block">最低音</span>
              <span id="detail-low" class="text-xs font-mono font-bold text-emerald-400">-</span>
            </div>
            <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800">
              <span class="text-[10px] text-slate-400 block">地声最高</span>
              <span id="detail-high" class="text-xs font-mono font-bold text-amber-400">-</span>
            </div>
            <div class="bg-slate-900/80 p-2 rounded-lg border border-slate-800">
              <span class="text-[10px] text-slate-400 block">裏声最高</span>
              <span id="detail-falsetto" class="text-xs font-mono font-bold text-purple-400">-</span>
            </div>
          </div>
        </div>

        <!-- 自己ベストスコア -->
        <div class="grid grid-cols-2 gap-2">
          <div class="bg-blue-950/30 border border-blue-900/50 rounded-xl p-2.5 text-center">
            <span class="text-[10px] text-blue-400 font-semibold block mb-0.5">JOYSOUND 自己ベスト</span>
            <span id="detail-joy-best" class="text-base font-mono font-bold text-blue-300">-</span>
          </div>
          <div class="bg-rose-950/30 border border-rose-900/50 rounded-xl p-2.5 text-center">
            <span class="text-[10px] text-rose-400 font-semibold block mb-0.5">LIVE DAM 自己ベスト</span>
            <span id="detail-dam-best" class="text-base font-mono font-bold text-rose-300">-</span>
          </div>
        </div>

        <!-- スコア推移グラフ -->
        <div class="bg-slate-950/60 border border-slate-800 rounded-xl p-3">
          <div class="text-[11px] font-semibold text-slate-400 mb-2 flex items-center justify-between">
            <span>スコア推移グラフ</span>
            <span class="text-[10px] text-slate-500">練習の成果</span>
          </div>
          <div class="w-full h-44">
            <canvas id="score-chart"></canvas>
          </div>
        </div>

        <!-- 新しい点数を記録するフォーム（被りを完全解消） -->
        <div class="bg-indigo-950/20 border border-indigo-900/40 rounded-xl p-3 space-y-3">
          <h3 class="text-xs font-bold text-indigo-300 flex items-center gap-1.5">
            <i data-lucide="plus-circle" class="w-3.5 h-3.5"></i>
            新しいスコアを記録
          </h3>
          <form id="record-score-form" class="space-y-3">
            <!-- 機種選択ボタン（タップで切り替え） -->
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">採点機種</label>
              <div class="grid grid-cols-2 gap-2">
                <button type="button" id="btn-select-joy" class="py-2 px-3 rounded-lg border text-xs font-bold transition flex items-center justify-center gap-1.5 bg-blue-600/30 text-blue-300 border-blue-500 shadow-sm">
                  <span class="w-2 h-2 rounded-full bg-blue-400"></span>
                  JOYSOUND
                </button>
                <button type="button" id="btn-select-dam" class="py-2 px-3 rounded-lg border text-xs font-bold transition flex items-center justify-center gap-1.5 bg-slate-900 text-slate-400 border-slate-700">
                  <span class="w-2 h-2 rounded-full bg-slate-500"></span>
                  LIVE DAM
                </button>
              </div>
              <input type="hidden" id="score-input-machine" value="JOY">
            </div>

            <!-- 日付と点数（2列構成で十分な横幅を確保） -->
            <div class="grid grid-cols-1 sm:grid-cols-2 gap-2.5">
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">歌唱日</label>
                <input type="date" id="score-input-date" required class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              </div>
              <div>
                <label class="text-[10px] text-slate-400 block mb-1">得点</label>
                <input type="number" step="0.001" min="0" max="100" id="score-input-val" required placeholder="例: 94.250" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-200 font-mono focus:outline-none focus:border-indigo-500">
              </div>
            </div>

            <!-- メモ -->
            <div>
              <label class="text-[10px] text-slate-400 block mb-1">メモ（任意）</label>
              <input type="text" id="score-input-memo" placeholder="例: 原キー、キー-2、サビ裏声 など" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-3 py-2 text-xs text-slate-300 focus:outline-none focus:border-indigo-500">
            </div>

            <button type="submit" class="w-full py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-lg text-xs font-bold transition shadow-md shadow-indigo-600/30 active:scale-98">
              スコアを保存
            </button>
          </form>
        </div>

        <!-- 履歴一覧 -->
        <div class="space-y-2">
          <h3 class="text-xs font-bold text-slate-300 flex items-center justify-between">
            <span>過去の歌唱履歴 (<span id="history-count">0</span>件)</span>
          </h3>
          <div id="history-list" class="space-y-1.5"></div>
        </div>
      </div>
    </div>
  </div>

  <!-- 2. 曲追加 / 編集モーダル -->
  <div id="edit-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-end sm:items-center justify-center p-0 sm:p-4">
    <div class="bg-slate-900 border border-slate-700/80 w-full sm:max-w-md rounded-t-2xl sm:rounded-2xl max-h-[92vh] flex flex-col overflow-hidden shadow-2xl">
      <div class="p-4 border-b border-slate-800 flex items-center justify-between bg-slate-900/80">
        <h2 id="modal-form-title" class="text-sm font-bold text-slate-100">曲を追加</h2>
        <button id="btn-close-edit" class="p-1.5 text-slate-400 hover:text-white rounded-lg">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <form id="song-edit-form" class="overflow-y-auto p-4 space-y-3.5 custom-scroll">
        <input type="hidden" id="form-song-id">

        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">曲名 <span class="text-rose-500">*</span></label>
          <input type="text" id="form-title" required placeholder="曲名を入力" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>

        <div>
          <label class="text-xs font-semibold text-slate-300 block mb-1">曲名よみがな（ひらがな） <span class="text-rose-500">*</span></label>
          <input type="text" id="form-reading" required placeholder="例: すいへいせん" class="w-full bg-slate-950 border border-slate-700 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-indigo-500">
        </div>

        <!-- 既出アーティストから選択 -->
        <div class="bg-slate-950/70 p-3 rounded-xl border border-slate-800 space-y-2">
          <div>
            <label class="text-[11px] font-semibold text-indigo-400 block mb-1 flex items-center justify-between">
              <span>既出アーティストから選ぶ</span>
              <span class="text-[10px] text-slate-500 font-normal">自動入力</span>
            </label>
            <select id="select-existing-artist" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-slate-200 focus:outline-none focus:border-indigo-500">
              <option value="">-- 登録済みアーティストから選択 --</option>
            </select>
          </div>

          <div class="grid grid-cols-2 gap-2 pt-1">
            <div>
              <label class="text-[11px] text-slate-400 block mb-1">アーティスト名 <span class="text-rose-500">*</span></label>
              <input type="text" id="form-artist" required placeholder="歌手名" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>
            <div>
              <label class="text-[11px] text-slate-400 block mb-1">歌手よみがな</label>
              <input type="text" id="form-artist-reading" placeholder="例: ばっくなんばー" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white focus:outline-none focus:border-indigo-500">
            </div>
          </div>
        </div>

        <!-- 音域ドロップダウン選択 -->
        <div class="bg-slate-950 p-3 rounded-xl border border-slate-800 space-y-2.5">
          <div class="flex items-center justify-between">
            <span class="text-xs font-bold text-slate-300">音域設定</span>
            <span class="text-[10px] text-slate-500">中央ド = C4</span>
          </div>

          <div>
            <label class="text-[11px] text-slate-400 block mb-1">最低音</label>
            <select id="form-low" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono"></select>
          </div>

          <div>
            <label class="text-[11px] text-slate-400 block mb-1">最高音（地声）</label>
            <select id="form-high" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono"></select>
          </div>

          <div>
            <label class="text-[11px] text-slate-400 block mb-1">裏声最高音（存在する場合）</label>
            <select id="form-falsetto" class="w-full bg-slate-900 border border-slate-700 rounded-lg px-2.5 py-1.5 text-xs text-white font-mono"></select>
          </div>
        </div>

        <div class="pt-2 flex items-center gap-2">
          <button type="button" id="btn-delete-song" class="hidden px-3 py-2.5 bg-rose-600/20 text-rose-400 border border-rose-600/30 rounded-xl text-xs font-semibold hover:bg-rose-600/30 transition">
            削除
          </button>
          <button type="submit" class="flex-1 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold transition shadow-lg shadow-indigo-600/30">
            保存する
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- 3. JSONモーダル（一時参照モード対応） -->
  <div id="json-modal" class="fixed inset-0 z-50 bg-black/80 backdrop-blur-sm hidden flex items-center justify-center p-4">
    <div class="bg-slate-900 border border-slate-700/80 w-full max-w-lg rounded-2xl p-4 flex flex-col space-y-3 shadow-2xl">
      <div class="flex items-center justify-between">
        <h3 class="text-sm font-bold text-slate-100 flex items-center gap-1.5">
          <i data-lucide="database" class="w-4 h-4 text-indigo-400"></i>
          JSONデータ管理
        </h3>
        <button id="btn-close-json" class="p-1 text-slate-400 hover:text-white">
          <i data-lucide="x" class="w-5 h-5"></i>
        </button>
      </div>

      <p class="text-[11px] text-slate-400 leading-relaxed">
        バックアップのコピー、または外部JSONの読み込みが可能です。「一時参照」を行うと、現在の端末データを上書きせず安全に閲覧できます。
      </p>

      <textarea id="json-textarea" class="w-full h-52 bg-slate-950 border border-slate-700 rounded-xl p-3 text-[11px] font-mono text-slate-300 resize-none focus:outline-none"></textarea>

      <div class="space-y-2 pt-1">
        <div class="grid grid-cols-2 gap-2">
          <button id="btn-view-temp-json" class="px-3 py-2 bg-amber-600/30 hover:bg-amber-600/40 text-amber-300 border border-amber-500/50 rounded-xl text-xs font-bold transition">
            JSONを一時参照する
          </button>
          <button id="btn-import-json-permanent" class="px-3 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 border border-slate-700 rounded-xl text-xs font-medium transition">
            ローカルに完全取込
          </button>
        </div>
        <button id="btn-copy-json" class="w-full py-2 bg-indigo-600 hover:bg-indigo-500 text-white rounded-xl text-xs font-bold shadow-md shadow-indigo-600/30 transition">
          現在のJSONをコピー
        </button>
      </div>
    </div>
  </div>

  <script>
    // --- 音域定義とドロップダウン生成 (A1〜C6) ---
    const NOTE_NAMES = ['C', 'C#', 'D', 'D#', 'E', 'F', 'F#', 'G', 'G#', 'A', 'A#', 'B'];
    const PITCH_OPTIONS = [];

    function generatePitchOptions() {
      for (let oct = 1; oct <= 6; oct++) {
        for (let i = 0; i < 12; i++) {
          const note = NOTE_NAMES[i];
          const pitch = `${note}${oct}`;
          let label = pitch;
          if (oct === 1 && (note === 'A' || note === 'A#' || note === 'B')) label += ` (lowlow${note})`;
          else if (oct === 2) label += ` (low${note})`;
          else if (oct === 3) label += ` (mid1${note})`;
          else if (oct === 4) label += (pitch === 'C4') ? ' (mid2C:中央ド)' : ` (mid2${note})`;
          else if (oct === 5) label += ` (hi${note})`;
          else if (oct === 6 && note === 'C') label += ` (hihiC)`;

          PITCH_OPTIONS.push({ value: pitch, label: label });
          if (oct === 6 && note === 'C') break;
        }
      }
    }
    generatePitchOptions();

    function populateSelect(selectEl, selectedVal, includeNone = false) {
      selectEl.innerHTML = '';
      if (includeNone) {
        const opt = document.createElement('option');
        opt.value = '';
        opt.textContent = 'なし（裏声なし）';
        selectEl.appendChild(opt);
      }
      PITCH_OPTIONS.forEach(item => {
        const opt = document.createElement('option');
        opt.value = item.value;
        opt.textContent = item.label;
        if (item.value === selectedVal) opt.selected = true;
        selectEl.appendChild(opt);
      });
    }

    // --- 初期データベース（全曲0点・履歴なし） ---
    const defaultSongDatabase = [
      { id: "s1", title: "水平線", artist: "back number", reading: "すいへいせん", artistReading: "ばっくなんばー", low: "D3", high: "G4", falsetto: "C5", history: [] },
      { id: "s2", title: "世界に一つだけの花", artist: "槇原敬之", reading: "せかいにひとつだけのはな", artistReading: "まきはらのりゆき", low: "E3", high: "E4", falsetto: null, history: [] },
      { id: "s3", title: "奏（かなで）", artist: "スキマスイッチ", reading: "かなで", artistReading: "すきますいっち", low: "C3", high: "G4", falsetto: "A4", history: [] },
      { id: "s4", title: "小さな恋のうた", artist: "MONGOL800", reading: "ちいさなこいのうた", artistReading: "もんごるはっぴゃく", low: "A2", high: "E4", falsetto: null, history: [] },
      { id: "s5", title: "さよならエレジー", artist: "菅田将暉", reading: "さよならえれじー", artistReading: "すだまさき", low: "D3", high: "F#4", falsetto: null, history: [] },
      { id: "s6", title: "チェリー", artist: "スピッツ", reading: "ちぇりー", artistReading: "すぴっつ", low: "C3", high: "G4", falsetto: null, history: [] },
      { id: "s7", title: "天体観測", artist: "BUMP OF CHICKEN", reading: "てんたいかんそく", artistReading: "ばんぷおぶちきん", low: "D#3", high: "G#4", falsetto: null, history: [] },
      { id: "s8", title: "Pretender", artist: "Official髭男dism", reading: "ぷりてんだー", artistReading: "おふぃしゃるひげだんでぃずむ", low: "F3", high: "A#4", falsetto: "C#5", history: [] },
      { id: "s9", title: "Lemon", artist: "米津玄師", reading: "れもん", artistReading: "よねづけんし", low: "B2", high: "G#4", falsetto: "B4", history: [] },
      { id: "s10", title: "ひまわりの約束", artist: "秦基博", reading: "ひまわりのやくそく", artistReading: "はたもとひろ", low: "C3", high: "G4", falsetto: "A#4", history: [] },
      { id: "s11", title: "ケセラセラ", artist: "Mrs. GREEN APPLE", reading: "けせらせら", artistReading: "みせすぐりーんあっぷる", low: "C3", high: "C5", falsetto: "E5", history: [] },
      { id: "s12", title: "高嶺の花子さん", artist: "back number", reading: "たかねのはなこさん", artistReading: "ばっくなんばー", low: "C#3", high: "A4", falsetto: "B4", history: [] }
    ];

    // --- State 管理 ---
    let localSongDatabase = [];    // 実際のローカルデータ
    let currentViewingDatabase = []; // 現在画面に表示しているデータ
    let isJsonViewingMode = false; // JSON一時参照モード中フラグ
    let activeTab = 'kana';
    let currentSyl = 'ALL';
    let searchQuery = '';
    let currentSelectedSongId = null;
    let scoreChartInstance = null;

    const STORAGE_KEY = 'my_karaoke_data_v2';

    // データの読み込みと初期化（過去バージョンからの自動引き継ぎ含む）
    function initData() {
      let stored = localStorage.getItem(STORAGE_KEY);
      
      // 旧キーからの自動マイグレーション
      if (!stored) {
        const legacy = localStorage.getItem('my_karaoke_songs') || localStorage.getItem('my_karaoke_data');
        if (legacy) {
          try {
            const parsed = JSON.parse(legacy);
            if (Array.isArray(parsed)) {
              // 旧形式のjoy/damスコアを新形式のhistory配列に変換
              localSongDatabase = parsed.map((item, idx) => {
                const hist = [];
                if (item.joy && typeof item.joy === 'number') {
                  hist.push({ id: `h_mig_joy_${idx}`, date: '2026-10-01', machine: 'JOY', score: item.joy, memo: '引継データ' });
                }
                if (item.dam && typeof item.dam === 'number') {
                  hist.push({ id: `h_mig_dam_${idx}`, date: '2026-10-01', machine: 'DAM', score: item.dam, memo: '引継データ' });
                }
                return {
                  id: item.id || `s_${idx}_${Date.now()}`,
                  title: item.title,
                  artist: item.artist,
                  reading: item.reading || '',
                  artistReading: item.artistReading || '',
                  low: item.low || 'C3',
                  high: item.high || 'G4',
                  falsetto: item.falsetto || null,
                  history: item.history || hist
                };
              });
              saveToStorage();
              currentViewingDatabase = [...localSongDatabase];
              return;
            }
          } catch(e) {}
        }
      }

      if (stored) {
        try {
          localSongDatabase = JSON.parse(stored);
        } catch (e) {
          localSongDatabase = defaultSongDatabase;
        }
      } else {
        localSongDatabase = defaultSongDatabase;
      }
      saveToStorage();
      currentViewingDatabase = [...localSongDatabase];
    }

    function saveToStorage() {
      if (!isJsonViewingMode) {
        localStorage.setItem(STORAGE_KEY, JSON.stringify(localSongDatabase));
      }
    }

    // --- スコア集計 ---
    function getBestScores(song) {
      if (!song.history || song.history.length === 0) {
        return { joy: null, dam: null, count: 0 };
      }
      let joyBest = null;
      let damBest = null;
      song.history.forEach(h => {
        const sc = parseFloat(h.score);
        if (h.machine === 'JOY') {
          if (joyBest === null || sc > joyBest) joyBest = sc;
        } else if (h.machine === 'DAM') {
          if (damBest === null || sc > damBest) damBest = sc;
        }
      });
      return { joy: joyBest, dam: damBest, count: song.history.length };
    }

    // --- 50音判定 ---
    function getKanaRow(reading) {
      if (!reading) return '他';
      const c = reading.charAt(0);
      if (/[あ-おアイウエオ]/.test(c)) return 'あ';
      if (/[か-こカ-コが-ごガ-ゴ]/.test(c)) return 'か';
      if (/[さ-そサ-ソざ-ぞザ-ゾ]/.test(c)) return 'さ';
      if (/[た-とタ-トだ-どダ-ドっッ]/.test(c)) return 'た';
      if (/[な-のナ-ノ]/.test(c)) return 'な';
      if (/[は-ほハ-ホば-ぼバ-ボぱ-ぽパ-ポ]/.test(c)) return 'は';
      if (/[ま-もマ-モ]/.test(c)) return 'ま';
      if (/[や-よヤ-ヨ]/.test(c)) return 'や';
      if (/[ら-ろラ-ロ]/.test(c)) return 'ら';
      if (/[わ-んワ-ン]/.test(c)) return 'わ';
      return '他';
    }

    // --- 既出アーティスト一覧の更新 ---
    function updateExistingArtistDropdown() {
      const selectEl = document.getElementById('select-existing-artist');
      selectEl.innerHTML = '<option value="">-- 登録済みアーティストから選択 --</option>';

      // アーティスト名でユニーク化
      const map = new Map();
      currentViewingDatabase.forEach(s => {
        if (s.artist && !map.has(s.artist)) {
          map.set(s.artist, s.artistReading || '');
        }
      });

      // 50音順ソート
      const sorted = Array.from(map.entries()).sort((a, b) => (a[1] || a[0]).localeCompare(b[1] || b[0], 'ja'));
      sorted.forEach(([artist, reading]) => {
        const opt = document.createElement('option');
        opt.value = artist;
        opt.textContent = reading ? `${artist} (${reading})` : artist;
        opt.dataset.reading = reading;
        selectEl.appendChild(opt);
      });
    }

    // 既出アーティスト選択時の自動入力
    document.getElementById('select-existing-artist').addEventListener('change', (e) => {
      const selected = e.target.value;
      if (!selected) return;
      const opt = e.target.selectedOptions[0];
      document.getElementById('form-artist').value = selected;
      document.getElementById('form-artist-reading').value = opt.dataset.reading || '';
    });

    // --- レンダリング ---
    function render() {
      const container = document.getElementById('songs-container');
      const emptyState = document.getElementById('empty-state');
      const totalBadge = document.getElementById('total-songs-badge');
      totalBadge.textContent = `${currentViewingDatabase.length}曲`;

      let filtered = currentViewingDatabase.filter(s => {
        if (!searchQuery) return true;
        const q = searchQuery.toLowerCase();
        return (s.title && s.title.toLowerCase().includes(q)) ||
               (s.artist && s.artist.toLowerCase().includes(q)) ||
               (s.reading && s.reading.toLowerCase().includes(q)) ||
               (s.artistReading && s.artistReading.toLowerCase().includes(q));
      });

      if (currentSyl !== 'ALL') {
        filtered = filtered.filter(s => getKanaRow(s.reading) === currentSyl);
      }

      if (filtered.length === 0) {
        container.innerHTML = '';
        emptyState.classList.remove('hidden');
        lucide.createIcons();
        return;
      }
      emptyState.classList.add('hidden');

      if (activeTab === 'kana') {
        renderKanaView(filtered, container);
      } else if (activeTab === 'artist') {
        renderArtistView(filtered, container);
      } else if (activeTab === 'rank') {
        renderRankView(filtered, container);
      }

      lucide.createIcons();
    }

    function createSongCard(song) {
      const best = getBestScores(song);
      const card = document.createElement('div');
      card.className = "bg-bgCard hover:bg-bgCardHover border border-slate-800 hover:border-slate-700/80 rounded-xl p-3.5 transition cursor-pointer shadow-sm active:scale-[0.99]";
      card.onclick = () => openDetailModal(song.id);

      card.innerHTML = `
        <div class="flex items-start justify-between gap-2">
          <div class="flex-1 min-w-0">
            <h3 class="text-sm font-bold text-slate-100 truncate">${song.title}</h3>
            <p class="text-xs text-slate-400 truncate mt-0.5">${song.artist}</p>
          </div>
          <div class="flex items-center gap-1 font-mono text-[11px] shrink-0">
            <span class="px-1.5 py-0.5 rounded bg-slate-900 border border-slate-700 text-slate-300">低 ${song.low || '-'}</span>
            <span class="px-1.5 py-0.5 rounded bg-amber-950/40 border border-amber-800/40 text-amber-400 font-bold">高 ${song.high || '-'}</span>
            ${song.falsetto ? `<span class="px-1.5 py-0.5 rounded bg-purple-950/40 border border-purple-800/40 text-purple-400">裏 ${song.falsetto}</span>` : ''}
          </div>
        </div>

        <div class="mt-3 pt-2.5 border-t border-slate-800/60 flex items-center justify-between text-xs font-mono">
          <div class="flex items-center space-x-3">
            <span class="flex items-center gap-1.5 text-blue-400">
              <span class="w-1.5 h-1.5 rounded-full bg-blue-500"></span>
              JOY: <span class="font-bold">${best.joy !== null ? best.joy.toFixed(3) : '-'}</span>
            </span>
            <span class="flex items-center gap-1.5 text-rose-400">
              <span class="w-1.5 h-1.5 rounded-full bg-rose-500"></span>
              DAM: <span class="font-bold">${best.dam !== null ? best.dam.toFixed(3) : '-'}</span>
            </span>
          </div>
          <span class="text-[10px] text-slate-500 font-sans flex items-center gap-0.5">
            <i data-lucide="history" class="w-3 h-3"></i> ${best.count}回
          </span>
        </div>
      `;
      return card;
    }

    function renderKanaView(songs, container) {
      container.innerHTML = '';
      songs.sort((a, b) => (a.reading || '').localeCompare(b.reading || '', 'ja'));

      const groups = {};
      songs.forEach(s => {
        const row = getKanaRow(s.reading);
        if (!groups[row]) groups[row] = [];
        groups[row].push(s);
      });

      const rowOrder = ['あ', 'か', 'さ', 'た', 'な', 'は', 'ま', 'や', 'ら', 'わ', '他'];
      rowOrder.forEach(r => {
        if (!groups[r] || groups[r].length === 0) return;
        const sec = document.createElement('div');
        sec.className = "space-y-2";
        sec.innerHTML = `
          <div class="flex items-center gap-2 pt-1">
            <span class="w-5 h-5 rounded-full bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 text-xs font-bold flex items-center justify-center">${r}</span>
            <span class="text-xs font-bold text-slate-400">${r}行 (${groups[r].length})</span>
          </div>
        `;
        const list = document.createElement('div');
        list.className = "space-y-2";
        groups[r].forEach(song => list.appendChild(createSongCard(song)));
        sec.appendChild(list);
        container.appendChild(sec);
      });
    }

    function renderArtistView(songs, container) {
      container.innerHTML = '';
      songs.sort((a, b) => (a.artistReading || a.artist || '').localeCompare(b.artistReading || b.artist || '', 'ja'));

      const groups = {};
      songs.forEach(s => {
        const key = s.artist || '不明';
        if (!groups[key]) groups[key] = [];
        groups[key].push(s);
      });

      Object.keys(groups).forEach(artist => {
        const sec = document.createElement('div');
        sec.className = "space-y-2";
        sec.innerHTML = `
          <div class="flex items-center justify-between pt-1">
            <span class="text-xs font-bold text-indigo-400 flex items-center gap-1.5">
              <i data-lucide="mic" class="w-3.5 h-3.5"></i>
              ${artist}
            </span>
            <span class="text-[10px] text-slate-500 font-mono">${groups[artist].length}曲</span>
          </div>
        `;
        const list = document.createElement('div');
        list.className = "space-y-2";
        groups[artist].forEach(song => list.appendChild(createSongCard(song)));
        sec.appendChild(list);
        container.appendChild(sec);
      });
    }

    function renderRankView(songs, container) {
      container.innerHTML = '';
      const sorted = [...songs].sort((a, b) => {
        const aBest = Math.max(getBestScores(a).joy || 0, getBestScores(a).dam || 0);
        const bBest = Math.max(getBestScores(b).joy || 0, getBestScores(b).dam || 0);
        return bBest - aBest;
      });

      const list = document.createElement('div');
      list.className = "space-y-2";
      sorted.forEach((song, idx) => {
        const card = createSongCard(song);
        if (idx === 0) card.classList.add('ring-1', 'ring-amber-500/50');
        list.appendChild(card);
      });
      container.appendChild(list);
    }

    // --- 1. 詳細モーダル & グラフ ---
    function openDetailModal(songId) {
      currentSelectedSongId = songId;
      const song = currentViewingDatabase.find(s => s.id === songId);
      if (!song) return;

      document.getElementById('detail-title').textContent = song.title;
      document.getElementById('detail-artist').textContent = song.artist;
      document.getElementById('detail-low').textContent = song.low || '-';
      document.getElementById('detail-high').textContent = song.high || '-';
      document.getElementById('detail-falsetto').textContent = song.falsetto || 'なし';

      const best = getBestScores(song);
      document.getElementById('detail-joy-best').textContent = best.joy !== null ? `${best.joy.toFixed(3)}点` : '-';
      document.getElementById('detail-dam-best').textContent = best.dam !== null ? `${best.dam.toFixed(3)}点` : '-';

      // デフォルト日付
      document.getElementById('score-input-date').value = new Date().toISOString().split('T')[0];
      document.getElementById('score-input-val').value = '';
      document.getElementById('score-input-memo').value = '';

      // 機種ボタン初期化（JOY選択）
      setMachineSelection('JOY');

      renderHistoryList(song);
      renderChart(song);

      document.getElementById('detail-modal').classList.remove('hidden');
      lucide.createIcons();
    }

    function closeDetailModal() {
      document.getElementById('detail-modal').classList.add('hidden');
      if (scoreChartInstance) {
        scoreChartInstance.destroy();
        scoreChartInstance = null;
      }
    }

    // 機種ボタントグル
    function setMachineSelection(machine) {
      document.getElementById('score-input-machine').value = machine;
      const joyBtn = document.getElementById('btn-select-joy');
      const damBtn = document.getElementById('btn-select-dam');

      if (machine === 'JOY') {
        joyBtn.className = "py-2 px-3 rounded-lg border text-xs font-bold transition flex items-center justify-center gap-1.5 bg-blue-600/30 text-blue-300 border-blue-500 shadow-sm";
        damBtn.className = "py-2 px-3 rounded-lg border text-xs font-bold transition flex items-center justify-center gap-1.5 bg-slate-900 text-slate-400 border-slate-700";
      } else {
        damBtn.className = "py-2 px-3 rounded-lg border text-xs font-bold transition flex items-center justify-center gap-1.5 bg-rose-600/30 text-rose-300 border-rose-500 shadow-sm";
        joyBtn.className = "py-2 px-3 rounded-lg border text-xs font-bold transition flex items-center justify-center gap-1.5 bg-slate-900 text-slate-400 border-slate-700";
      }
    }
    document.getElementById('btn-select-joy').addEventListener('click', () => setMachineSelection('JOY'));
    document.getElementById('btn-select-dam').addEventListener('click', () => setMachineSelection('DAM'));

    function renderHistoryList(song) {
      const listEl = document.getElementById('history-list');
      const countEl = document.getElementById('history-count');
      const history = song.history ? [...song.history] : [];
      countEl.textContent = history.length;

      history.sort((a, b) => new Date(b.date) - new Date(a.date));

      if (history.length === 0) {
        listEl.innerHTML = `<div class="text-center py-4 text-xs text-slate-500">まだスコア記録がありません</div>`;
        return;
      }

      listEl.innerHTML = history.map(h => `
        <div class="bg-slate-950/70 border border-slate-800/80 rounded-lg p-2.5 flex items-center justify-between text-xs">
          <div class="space-y-0.5">
            <div class="flex items-center gap-2">
              <span class="px-1.5 py-0.5 rounded text-[10px] font-bold ${h.machine === 'JOY' ? 'bg-blue-900/40 text-blue-400 border border-blue-800' : 'bg-rose-900/40 text-rose-400 border border-rose-800'}">${h.machine}</span>
              <span class="font-mono text-slate-400 text-[11px]">${h.date}</span>
              <span class="font-mono font-bold text-slate-100 text-sm">${parseFloat(h.score).toFixed(3)}点</span>
            </div>
            ${h.memo ? `<p class="text-[11px] text-slate-400">${h.memo}</p>` : ''}
          </div>
          <button onclick="deleteScoreRecord('${h.id}')" class="p-1.5 text-slate-500 hover:text-rose-400 rounded transition">
            <i data-lucide="trash-2" class="w-3.5 h-3.5"></i>
          </button>
        </div>
      `).join('');
    }

    function renderChart(song) {
      const ctx = document.getElementById('score-chart').getContext('2d');
      if (scoreChartInstance) scoreChartInstance.destroy();

      const history = song.history ? [...song.history] : [];
      history.sort((a, b) => new Date(a.date) - new Date(b.date));

      const labels = history.map(h => h.date.slice(5));
      const joyData = history.map(h => h.machine === 'JOY' ? h.score : null);
      const damData = history.map(h => h.machine === 'DAM' ? h.score : null);

      scoreChartInstance = new Chart(ctx, {
        type: 'line',
        data: {
          labels: labels,
          datasets: [
            {
              label: 'JOYSOUND',
              data: joyData,
              borderColor: '#3b82f6',
              backgroundColor: 'rgba(59, 130, 246, 0.1)',
              spanGaps: true,
              tension: 0.2,
              pointRadius: 4,
              pointBackgroundColor: '#3b82f6'
            },
            {
              label: 'LIVE DAM',
              data: damData,
              borderColor: '#f43f5e',
              backgroundColor: 'rgba(244, 63, 94, 0.1)',
              spanGaps: true,
              tension: 0.2,
              pointRadius: 4,
              pointBackgroundColor: '#f43f5e'
            }
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          scales: {
            y: {
              min: 80,
              max: 100,
              grid: { color: 'rgba(51, 65, 85, 0.4)' },
              ticks: { color: '#94a3b8', font: { size: 10 } }
            },
            x: {
              grid: { display: false },
              ticks: { color: '#94a3b8', font: { size: 10 } }
            }
          },
          plugins: {
            legend: {
              labels: { color: '#cbd5e1', font: { size: 10 } }
            }
          }
        }
      });
    }

    // スコア追加
    document.getElementById('record-score-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const song = currentViewingDatabase.find(s => s.id === currentSelectedSongId);
      if (!song) return;

      const date = document.getElementById('score-input-date').value;
      const machine = document.getElementById('score-input-machine').value;
      const score = parseFloat(document.getElementById('score-input-val').value);
      const memo = document.getElementById('score-input-memo').value.trim();

      if (!song.history) song.history = [];
      song.history.push({
        id: 'h_' + Date.now(),
        date: date,
        machine: machine,
        score: score,
        memo: memo
      });

      saveToStorage();
      renderHistoryList(song);
      renderChart(song);
      render();
      lucide.createIcons();

      document.getElementById('score-input-val').value = '';
      document.getElementById('score-input-memo').value = '';
    });

    window.deleteScoreRecord = function(historyId) {
      if (!confirm('このスコア記録を削除しますか？')) return;
      const song = currentViewingDatabase.find(s => s.id === currentSelectedSongId);
      if (!song || !song.history) return;

      song.history = song.history.filter(h => h.id !== historyId);
      saveToStorage();
      renderHistoryList(song);
      renderChart(song);
      render();
      lucide.createIcons();
    };

    // --- 2. 曲編集 / 新規追加 ---
    function openEditModal(songId = null) {
      updateExistingArtistDropdown();
      const modal = document.getElementById('edit-modal');
      const titleEl = document.getElementById('modal-form-title');
      const deleteBtn = document.getElementById('btn-delete-song');

      if (songId) {
        const song = currentViewingDatabase.find(s => s.id === songId);
        if (!song) return;
        titleEl.textContent = '曲情報・音域の編集';
        document.getElementById('form-song-id').value = song.id;
        document.getElementById('form-title').value = song.title;
        document.getElementById('form-reading').value = song.reading || '';
        document.getElementById('form-artist').value = song.artist;
        document.getElementById('form-artist-reading').value = song.artistReading || '';

        populateSelect(document.getElementById('form-low'), song.low || 'C3');
        populateSelect(document.getElementById('form-high'), song.high || 'G4');
        populateSelect(document.getElementById('form-falsetto'), song.falsetto || '', true);

        deleteBtn.classList.remove('hidden');
      } else {
        titleEl.textContent = '新しい曲を追加';
        document.getElementById('form-song-id').value = '';
        document.getElementById('form-title').value = '';
        document.getElementById('form-reading').value = '';
        document.getElementById('form-artist').value = '';
        document.getElementById('form-artist-reading').value = '';

        populateSelect(document.getElementById('form-low'), 'C3');
        populateSelect(document.getElementById('form-high'), 'G4');
        populateSelect(document.getElementById('form-falsetto'), '', true);

        deleteBtn.classList.add('hidden');
      }

      modal.classList.remove('hidden');
    }

    document.getElementById('song-edit-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const id = document.getElementById('form-song-id').value;
      const title = document.getElementById('form-title').value.trim();
      const reading = document.getElementById('form-reading').value.trim();
      const artist = document.getElementById('form-artist').value.trim();
      const artistReading = document.getElementById('form-artist-reading').value.trim();
      const low = document.getElementById('form-low').value;
      const high = document.getElementById('form-high').value;
      const falsetto = document.getElementById('form-falsetto').value || null;

      if (id) {
        const song = currentViewingDatabase.find(s => s.id === id);
        if (song) {
          song.title = title;
          song.reading = reading;
          song.artist = artist;
          song.artistReading = artistReading;
          song.low = low;
          song.high = high;
          song.falsetto = falsetto;
        }
      } else {
        currentViewingDatabase.push({
          id: 's_' + Date.now(),
          title: title,
          reading: reading,
          artist: artist,
          artistReading: artistReading,
          low: low,
          high: high,
          falsetto: falsetto,
          history: []
        });
      }

      saveToStorage();
      document.getElementById('edit-modal').classList.add('hidden');
      if (id && currentSelectedSongId === id) {
        openDetailModal(id);
      }
      render();
    });

    document.getElementById('btn-delete-song').addEventListener('click', () => {
      const id = document.getElementById('form-song-id').value;
      if (!confirm('この曲を削除しますか？スコア履歴も消去されます。')) return;

      currentViewingDatabase = currentViewingDatabase.filter(s => s.id !== id);
      if (!isJsonViewingMode) {
        localSongDatabase = localSongDatabase.filter(s => s.id !== id);
      }
      saveToStorage();
      document.getElementById('edit-modal').classList.add('hidden');
      closeDetailModal();
      render();
    });

    // --- 3. JSONモーダル ＆ 一時参照モード処理 ---
    const jsonModal = document.getElementById('json-modal');
    const jsonBanner = document.getElementById('json-mode-banner');

    document.getElementById('btn-export-json').addEventListener('click', () => {
      document.getElementById('json-textarea').value = JSON.stringify(currentViewingDatabase, null, 2);
      jsonModal.classList.remove('hidden');
    });
    document.getElementById('btn-close-json').addEventListener('click', () => {
      jsonModal.classList.add('hidden');
    });
    document.getElementById('btn-copy-json').addEventListener('click', () => {
      navigator.clipboard.writeText(document.getElementById('json-textarea').value);
      alert('クリップボードにJSONをコピーしました！');
    });

    // 案A: 一時参照モード（ローカルデータを保護）
    document.getElementById('btn-view-temp-json').addEventListener('click', () => {
      try {
        const parsed = JSON.parse(document.getElementById('json-textarea').value);
        if (!Array.isArray(parsed)) throw new Error('配列ではありません');

        currentViewingDatabase = parsed;
        isJsonViewingMode = true;
        jsonBanner.classList.remove('hidden');
        jsonModal.classList.add('hidden');
        render();
        alert('JSONを一時参照モードで読み込みました。\nローカルデータは安全に保護されています。');
      } catch (e) {
        alert('有効なJSON配列形式ではありません');
      }
    });

    // 案B: ローカルに完全取り込み
    document.getElementById('btn-import-json-permanent').addEventListener('click', () => {
      if (!confirm('現在のローカルデータをこのJSONで完全に上書きしますか？')) return;
      try {
        const parsed = JSON.parse(document.getElementById('json-textarea').value);
        if (!Array.isArray(parsed)) throw new Error('配列ではありません');

        localSongDatabase = parsed;
        currentViewingDatabase = [...localSongDatabase];
        isJsonViewingMode = false;
        jsonBanner.classList.add('hidden');
        saveToStorage();
        jsonModal.classList.add('hidden');
        render();
        alert('ローカルストレージにデータを取り込みました！');
      } catch (e) {
        alert('有効なJSON配列形式ではありません');
      }
    });

    // 一時参照モード終了（ローカル復帰）
    document.getElementById('btn-exit-json-mode').addEventListener('click', () => {
      isJsonViewingMode = false;
      currentViewingDatabase = [...localSongDatabase];
      jsonBanner.classList.add('hidden');
      render();
      alert('ローカルのデータに戻りました。');
    });

    // --- イベントリスナー ---
    document.getElementById('btn-open-add-modal').addEventListener('click', () => openEditModal(null));
    document.getElementById('btn-close-edit').addEventListener('click', () => document.getElementById('edit-modal').classList.add('hidden'));
    document.getElementById('btn-open-edit').addEventListener('click', () => openEditModal(currentSelectedSongId));
    document.getElementById('btn-close-detail').addEventListener('click', closeDetailModal);

    const searchInput = document.getElementById('search-input');
    const clearBtn = document.getElementById('clear-search-btn');
    searchInput.addEventListener('input', (e) => {
      searchQuery = e.target.value.trim();
      clearBtn.classList.toggle('hidden', searchQuery.length === 0);
      render();
    });
    clearBtn.addEventListener('click', () => {
      searchInput.value = '';
      searchQuery = '';
      clearBtn.classList.add('hidden');
      render();
    });

    document.querySelectorAll('.syl-btn').forEach(btn => {
      btn.addEventListener('click', () => {
        document.querySelectorAll('.syl-btn').forEach(b => {
          b.className = 'syl-btn px-2.5 py-1 rounded-md hover:bg-slate-800 whitespace-nowrap text-slate-400';
        });
        btn.className = 'syl-btn px-2.5 py-1 rounded-md bg-indigo-600/20 text-indigo-400 border border-indigo-500/30 whitespace-nowrap font-bold';
        currentSyl = btn.dataset.syl;
        render();
      });
    });

    const tabs = [
      { id: 'tab-btn-kana', type: 'kana' },
      { id: 'tab-btn-artist', type: 'artist' },
      { id: 'tab-btn-rank', type: 'rank' }
    ];
    tabs.forEach(t => {
      document.getElementById(t.id).addEventListener('click', () => {
        activeTab = t.type;
        tabs.forEach(ot => {
          const el = document.getElementById(ot.id);
          if (ot.type === activeTab) {
            el.className = 'flex flex-col items-center justify-center py-1 text-indigo-400 font-semibold transition active:scale-95';
          } else {
            el.className = 'flex flex-col items-center justify-center py-1 text-slate-400 hover:text-slate-200 transition active:scale-95';
          }
        });
        render();
      });
    });

    // 初期化実行
    initData();
    render();
  </script>
</body>
</html>
